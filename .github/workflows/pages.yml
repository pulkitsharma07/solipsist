# Publishes the website on GitHub Pages: the Astro Starlight project in site/ (the landing page at /, the
# documentation at /docs/), plus FEATURES.html as /features.html.
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site/**", "FEATURES.html", "CONFIGURATION.md", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
        working-directory: site
      # Writes the landing page, the configuration page and features.html first (scripts/site/build.ts), then dist/.
      - run: bun run build
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
