# A test that fails now and then is a bug in the app: CI never retries. This runs one suite many times to
# catch it in the act.
name: Repeat a test
on:
  workflow_dispatch:
    inputs:
      file: { description: "Test file, e.g. ./test/e2e-dom/agent.dom.tsx", required: true }
      times: { description: "How many runs", required: true, default: "12" }
      os: { description: "Runner", required: true, default: ubuntu-latest, type: choice, options: [ubuntu-latest] }
permissions: { contents: read }

jobs:
  repeat:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
      - name: Run it again and again
        env: { FILE: "${{ inputs.file }}", TIMES: "${{ inputs.times }}" }
        run: |
          fails=0
          for i in $(seq 1 "$TIMES"); do
            echo "::group::run $i"; if ! bun test "$FILE"; then fails=$((fails+1)); echo "::error::run $i failed"; fi; echo "::endgroup::"
          done
          echo "$fails of $TIMES runs failed"; [ "$fails" -eq 0 ]
