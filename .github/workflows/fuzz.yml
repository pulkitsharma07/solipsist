# Nightly: the fuzzers run long. Nobody watches a nightly run, so a failure opens an issue with its seed and shrunk case.
name: Fuzz
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions: { contents: read }

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
      - name: Fuzz
        id: fuzz
        run: |
          set -o pipefail
          { FUZZ_RUNS=16000 bun test test/fuzz.test.ts && DOM_FUZZ_RUNS=200 bun test ./test/e2e-dom/fuzz.dom.tsx; } 2>&1 | tee fuzz.log
      - if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const log = require("fs").readFileSync("fuzz.log", "utf8");
            const tail = log.split("\n").slice(-120).join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Nightly fuzz failed (${new Date().toISOString().slice(0, 10)})`,
              labels: ["bug"],
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe seed and the shrunk case are in the log; the case becomes a named test.\n\n\`\`\`\n${tail}\n\`\`\``,
            });
